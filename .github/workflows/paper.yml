# Paper trading automatique et gratuit via GitHub Actions.
# - Chaque jour à 00:10 UTC (01:10 à Paris en hiver), juste après la clôture de la bougie journalière.
# - À chaque mise à jour du code du bot (l'exécution est idempotente : une seule fois par bougie).
# - À la demande depuis l'onglet Actions (bouton "Run workflow").
# L'état (state/) est commité dans le dépôt : l'historique du paper trading est versionné.
name: paper-trading
on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/paper.yml"
permissions:
  contents: write
concurrency:
  group: paper-trading
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data
          key: ohlcv-${{ github.run_id }}
          restore-keys: ohlcv-
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests -m "not network"
      - name: Run paper trading
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p state
          python main.py paper run | tee -a state/run.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 12 state/run.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit state
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "rien à committer"; exit 0; fi
          git commit -m "paper: $(date -u +%F)"
          git pull --rebase origin main
          git push
