# Bot n°2 — day trading (paper) : toutes les heures, à la minute 7.
# Les remplissages sont calculés sur les bougies 5 min (ordres stop virtuels posés à 00:00 UTC),
# donc un passage par heure suffit ; la revente a lieu à la clôture de 00:00 UTC.
name: daytrade
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "daytrade/**"
      - ".github/workflows/daytrade.yml"
permissions:
  contents: write
concurrency:
  group: botcrypto-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests du bot n°2
        run: python -m pytest -q tests/test_daytrade.py
      - name: Bot n°2
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py day run | tee /tmp/day.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /tmp/day.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "daytrade-bot"
          git config user.email "daytrade-bot@users.noreply.github.com"
          git add state/day/ docs/day.json
          if git diff --cached --quiet; then echo "rien à committer"; exit 0; fi
          git commit -m "day: $(date -u +'%F %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
